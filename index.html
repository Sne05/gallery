<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gallary{
            width: 400px;
            height: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .card1{
            width: 200px;
            position: relative; 
            transform: rotate(20deg);
            top: 20px;
            
        }
        .card2{
            width: 200px; 
            position: relative; 
             transform: rotate(-20deg);
            top: -20px; 
        }
        .card3{
            width: 200px; 
            position: relative; 
             transform: rotate(50deg);
            top: -100px; 
            left: 200px;
        }
        .card4{
            width: 200px; 
            position: relative;  
            transform: rotate(-50deg);
            top: -100px; 
            left: 100px;
        }
        .card5{
            width: 200px; 
            position: relative;  
            transform: rotate(10deg);
            top: -300px; 
            left: 100px;
        }
        .card6{
            width: 200px; 
            position: relative; 
            transform: rotate(10deg);
            top: -500px; 
            left: 100px; 
        }
        .card7{
            width: 200px; 
            position: relative; 
            transform: rotate(-10deg);
            top: -500px; 
            left: 100px; 
        }
        .card8{
            width: 200px; 
            position: relative;  
              transform: rotate(40deg);
            top: -800px; 
            left: 100px; 
        }
        .card9{
            width: 200px; 
            position: relative;  
            transform: rotate(-40deg);
            top: -800px; 
            left: 100px; 
        }
        .card10{
            width: 200px; 
            position: relative;  
            transform: rotate(40deg);
            top: -800px; 
            left: 100px; 
        }
    </style>
</head>
<body>
    <div class="gallary">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwqx895zaLfZmiLYl8DtMpGak0QA3Vi7z3ktYTJOUkCQ&s=10" alt="" class="card3">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBTe61DtGd6AiTYW-YDvwxvxnYn1lwmBTCX6unSb4J_Q&s=10" alt="" class="card4">
